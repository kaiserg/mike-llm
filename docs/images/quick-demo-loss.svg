<svg xmlns="http://www.w3.org/2000/svg" width="800" height="410" viewBox="0 0 800 410" role="img" aria-labelledby="title desc">
  <title id="title">Quick demo training and validation loss</title>
  <desc id="desc">Both losses fall from about 2.75 before training to about 0.3 after 150 updates.</desc>
  <style>
    text { font: 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #24292f; }
    .title { font-size: 20px; font-weight: 600; }
    .grid { stroke: #d8dee4; stroke-width: 1; }
    .axis { stroke: #57606a; stroke-width: 1.5; }
    .train { fill: none; stroke: #0969da; stroke-width: 3; }
    .validation { fill: none; stroke: #cf222e; stroke-width: 3; }
  </style>
  <rect width="800" height="410" fill="#ffffff"/>
  <text x="400" y="22" text-anchor="middle" class="title">Learning a synthetic color sequence from random weights</text>
  <line x1="72" y1="28.0" x2="732" y2="28.0" class="grid"/><text x="62" y="32.0" text-anchor="end">3.0</text><line x1="72" y1="103.0" x2="732" y2="103.0" class="grid"/><text x="62" y="107.0" text-anchor="end">2.2</text><line x1="72" y1="178.0" x2="732" y2="178.0" class="grid"/><text x="62" y="182.0" text-anchor="end">1.5</text><line x1="72" y1="253.0" x2="732" y2="253.0" class="grid"/><text x="62" y="257.0" text-anchor="end">0.7</text><line x1="72" y1="328.0" x2="732" y2="328.0" class="grid"/><text x="62" y="332.0" text-anchor="end">0.0</text>
  <line x1="72" y1="28" x2="72" y2="328" class="axis"/>
  <line x1="72" y1="328" x2="732" y2="328" class="axis"/>
  <line x1="72.0" y1="328" x2="72.0" y2="333" class="axis"/><text x="72.0" y="350" text-anchor="middle">0</text><line x1="182.0" y1="328" x2="182.0" y2="333" class="axis"/><text x="182.0" y="350" text-anchor="middle">25</text><line x1="292.0" y1="328" x2="292.0" y2="333" class="axis"/><text x="292.0" y="350" text-anchor="middle">50</text><line x1="402.0" y1="328" x2="402.0" y2="333" class="axis"/><text x="402.0" y="350" text-anchor="middle">75</text><line x1="512.0" y1="328" x2="512.0" y2="333" class="axis"/><text x="512.0" y="350" text-anchor="middle">100</text><line x1="622.0" y1="328" x2="622.0" y2="333" class="axis"/><text x="622.0" y="350" text-anchor="middle">125</text><line x1="732.0" y1="328" x2="732.0" y2="333" class="axis"/><text x="732.0" y="350" text-anchor="middle">150</text>
  <polyline points="72.0,50.2 182.0,193.5 292.0,241.4 402.0,269.0 512.0,288.3 622.0,295.9 732.0,301.5" class="train"/>
  <polyline points="72.0,51.9 182.0,194.6 292.0,241.4 402.0,268.5 512.0,288.4 622.0,293.2 732.0,295.9" class="validation"/>
  <line x1="545" y1="373" x2="575" y2="373" class="train"/><text x="583" y="378">training loss</text>
  <line x1="665" y1="373" x2="695" y2="373" class="validation"/><text x="703" y="378">validation loss</text>
  <text x="402.0" y="397" text-anchor="middle">training updates</text>
  <text x="18" y="178.0" text-anchor="middle" transform="rotate(-90 18 178.0)">cross-entropy loss</text>
</svg>
