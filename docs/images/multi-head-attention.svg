<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820" role="img" aria-labelledby="title desc"><title id="title">Causal multi-head attention</title><desc id="desc">The same input feeds three independent QKV heads. Each produces two by five by four features. Concatenation restores width twelve, followed by a learned linear output projection.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8Z" fill="#475569"/></marker></defs><rect width="1100" height="820" fill="#f8fafc"/><g font-family="Arial, sans-serif" text-anchor="middle" fill="#0f172a"><text x="550" y="45" font-size="28" font-weight="bold">Causal multi-head attention</text><text x="550" y="76" font-size="17">B = 2 independent sequences · T = 5 tokens · D = 12 features · H = 3 heads</text><rect x="345" y="105" width="410" height="76" rx="14" fill="#e2e8f0" stroke="#64748b"/><text x="550.0" y="134" font-size="18">Input embeddings X</text><text x="550.0" y="161" font-size="18">[2, 5, 12]</text><path d="M550 181 V212 H200 V248" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="250" width="320" height="220" rx="14" fill="#dbeafe" stroke="#64748b"/><text x="200.0" y="279" font-size="18">Head 1: own learned Q, K, V</text><text x="200.0" y="306" font-size="18">Each projection: 12 → 4</text><text x="200.0" y="333" font-size="18">Q, K, V: [2, 5, 4]</text><text x="200.0" y="360" font-size="18">Scores: QKᵀ / √4</text><text x="200.0" y="387" font-size="18">Causal mask → softmax</text><text x="200.0" y="414" font-size="18">Weighted values: [2, 5, 4]</text><path d="M200 470 V500 H550 V529" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M550 181 V212 H550 V248" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="390" y="250" width="320" height="220" rx="14" fill="#dcfce7" stroke="#64748b"/><text x="550.0" y="279" font-size="18">Head 2: own learned Q, K, V</text><text x="550.0" y="306" font-size="18">Each projection: 12 → 4</text><text x="550.0" y="333" font-size="18">Q, K, V: [2, 5, 4]</text><text x="550.0" y="360" font-size="18">Scores: QKᵀ / √4</text><text x="550.0" y="387" font-size="18">Causal mask → softmax</text><text x="550.0" y="414" font-size="18">Weighted values: [2, 5, 4]</text><path d="M550 470 V500 H550 V529" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M550 181 V212 H900 V248" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="740" y="250" width="320" height="220" rx="14" fill="#ffedd5" stroke="#64748b"/><text x="900.0" y="279" font-size="18">Head 3: own learned Q, K, V</text><text x="900.0" y="306" font-size="18">Each projection: 12 → 4</text><text x="900.0" y="333" font-size="18">Q, K, V: [2, 5, 4]</text><text x="900.0" y="360" font-size="18">Scores: QKᵀ / √4</text><text x="900.0" y="387" font-size="18">Causal mask → softmax</text><text x="900.0" y="414" font-size="18">Weighted values: [2, 5, 4]</text><path d="M900 470 V500 H550 V529" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="320" y="530" width="460" height="76" rx="14" fill="#ede9fe" stroke="#64748b"/><text x="550.0" y="559" font-size="18">Concatenate along feature axis</text><text x="550.0" y="586" font-size="18">3 × [2, 5, 4] → [2, 5, 12]</text><path d="M550 606 V637" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="320" y="638" width="460" height="76" rx="14" fill="#e2e8f0" stroke="#64748b"/><text x="550.0" y="667" font-size="18">Linear projection: 12 → 12 + bias</text><text x="550.0" y="694" font-size="18">Output Y: [2, 5, 12]</text><text x="550" y="756" font-size="17">Every head sees the same full input. Heads are not batches.</text><text x="550" y="785" font-size="16">432 QKV parameters + 156 output projection parameters = 588</text></g></svg>